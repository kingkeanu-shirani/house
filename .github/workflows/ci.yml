# house_ai continuous integration (REVIEW_REPORT M7 / top-10 item 3): the unit suite and a sample of every authored
# spec on the oldest supported Python (3.9, setup.py) and the development one (3.14), on Windows and Linux.
# Stdlib only: nothing is installed, no secrets are used, no paid service is called, and the network-touching agent
# transports refuse to run (HOUSE_AI_FORBID_NETWORK=1). Tests run with a throwaway HOME / USERPROFILE.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: unit suite and spec sample (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.14"]
    env:
      HOUSE_AI_FORBID_NETWORK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      # the repository's files are LF and the raw catalog's byte spans are pinned: no line-ending conversion
      - name: keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: throwaway home (the user's ~/.house_ai is never involved)
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - name: empty folders git does not carry
        run: mkdir -p tasks/templates house_sim/data/actions

      - name: interpreter
        run: python -VV

      # every tests/test_*.py, normal and HOUSE_SIM_STRICT=1, one process per file and mode; exit 1 on any failure.
      # This is the correctness suite: the wall-clock bounds are off here (HOUSE_SIM_PERF_TESTS=0; under four parallel
      # processes on a shared runner they fail for reasons that are not regressions, phase-1 red team) and run in the
      # separate perf job below
      - name: unit suite
        env:
          HOUSE_SIM_PERF_TESTS: "0"
        run: python tools/orchestration/green_tests.py 4 --json "$RUNNER_TEMP/green_tests.json"

      # every authored spec on one seed (41), each in its own perception and camera mode, verified by the tool itself
      # (initial, idle, reference and every wrong plan); the hash-chained log is kept as an artifact. A spec the tier-1
      # gate's committed allowlist excuses on its failing seeds does not fail the step (--allowlist), so a red step
      # means a new regression
      - name: spec sample
        if: always()
        run: >
          python tools/orchestration/run_check.py run --all --seeds 41 --workers 2 --role ci --allowlist
          --batch "${{ matrix.os }}-py${{ matrix.python }}" --log "$RUNNER_TEMP/check_log.jsonl"
          --json "$RUNNER_TEMP/check_entry.json"

      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/green_tests.json
            ${{ runner.temp }}/check_log.jsonl
            ${{ runner.temp }}/check_entry.json
          if-no-files-found: ignore

  # the wall-clock bounds (every test that reads HOUSE_SIM_PERF_TESTS), alone, one process at a time, normal and strict;
  # each bound passes when one of 3 attempts meets it (the tolerance for a runner busy for a moment). Informational:
  # shared runners are not the reference machine, so a slow runner never turns CI red; the tier-1 gate runs the same
  # job in G7 on a quiet machine, where a bound failing every attempt fails the gate (tools/orchestration/README.md)
  perf:
    name: wall-clock bounds alone (${{ matrix.os }}, informational)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HOUSE_AI_FORBID_NETWORK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: throwaway home (the user's ~/.house_ai is never involved)
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - name: empty folders git does not carry
        run: mkdir -p tasks/templates house_sim/data/actions

      - name: wall-clock bounds (best of 3, alone)
        run: python tools/orchestration/green_tests.py --perf --attempts 3 --json "$RUNNER_TEMP/perf_tests.json"

      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}
          path: ${{ runner.temp }}/perf_tests.json
          if-no-files-found: ignore
