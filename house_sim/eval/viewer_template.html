[data-k], [data-p], [data-a], [data-hz], [data-room], [data-door] { cursor: help; }
#roomHead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }

</header>

<div id="warnings"></div>
<div id="instruction"></div>

      <div id="legend"></div>
    </section>
  </div>
  <div class="col right">
    <section class="panel" aria-label="Steps">
      <h2>Steps</h2>
      <div id="stepList"></div>
    </section>
    <section class="panel" aria-label="Changes">

      <div id="diffBody"></div>
    </section>
  </div>
</main>
<div class="timeline" role="group" aria-label="Timeline">
  <button id="bFirst" type="button" title="First frame (Home)">&#9198;</button>

  <button id="bNext" type="button" title="Next step (Right arrow)">&#9654;</button>
  <button id="bLast" type="button" title="Last frame (End)">&#9197;</button>

    <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option>
    <option value="2">2x</option><option value="4">4x</option><option value="8">8x</option>
  </select>
  <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Timeline scrubber">
  <span id="stepLabel"></span>
</div>
<div id="tooltip" role="tooltip" hidden></div>

    Object.keys(a).sort().forEach(function (k) { var names = {l: "label", ro: "role", sp: "species", po: "posture", ac: "activity", mo: "mood", aw: "awake", ho: "holding", ca: "carrying", le: "leashed", hid: "concealed"}; if (k !== "x" && k !== "y") rows.push([names[k] || k, esc(trunc(fmt(a[k]), 120))]); });
    return "<h3>" + esc(a.l || a.label || id) + "</h3>" + kv(rows);
  }
  function tooltipFor(el) {
    var sc = S.scene; if (!sc || sc.na) return "";
    var k = el.getAttribute("data-k"), hz = el.getAttribute("data-hz"), room = el.getAttribute("data-room"), door = el.getAttribute("data-door");
    if (k) { var e = sc.ents[k] || (sc.held_records || {})[k]; if (!e) return ""; return sc.mode === "oracle" ? oracleEntityHtml(k, e, sc.ents) : perceivedEntityHtml(k, e, sc.ents); }
    if (el.getAttribute("data-p")) { var pid = el.getAttribute("data-p"); return agentHtml(pid, sc.people[pid] || {}); }
    if (el.getAttribute("data-a")) { var aid = el.getAttribute("data-a"); return agentHtml(aid, sc.pets[aid] || {}); }
    if (el.getAttribute("data-robot")) {
      var rb = sc.robot, ex = rb.extra || {};
      return "<h3>Robot</h3>" + kv([["cell", esc(rb.x + ", " + rb.y)], ["posture", esc(rb.posture)], ["holding", esc(rb.held.join(", ") || "nothing")], ["battery", esc(rb.battery)],
        ["docked", ex.dk ? "yes" : ""], ["standing on", esc(ex.so || "")], ["speed mode", esc(ex.sm || "")], ["stopped", ex.sp ? "yes" : ""], ["fallen", ex.fl ? "yes" : ""]]);
    }
    if (hz) {
      var list = sc.hazards.filter(function (h) { return h[0] + "," + h[1] === hz; });
      if (!list.length && sc.wet.length) list = [[0, 0, "wet", "room wet cell"]];
      return "<h3>Hazard at " + esc(hz) + "</h3><ul class=\"plain\">" + list.map(function (h) { return "<li>" + esc(h[2]) + ' <span class="muted">source <code>' + esc(h[3]) + "</code></span></li>"; }).join("") + "</ul>";
    }
    if (room) { var r = ROOMS[room] || {}; return "<h3>" + esc(r.l || room) + "</h3>" + kv([["id", "<code>" + esc(room) + "</code>"], ["type", esc(r.ty)], ["floor", esc(r.f)], ["size (m)", esc(r.w + " × " + r.h)], ["grid", esc(r.cols + " × " + r.rows + " cells")], ["outdoor", r.o ? "yes" : ""]]); }
    if (door) {
      var c = (sc.conns || []).filter(function (x) { return x.id === door; })[0];
      var l = (LAYOUT.links || []).filter(function (x) { return x.id === door; })[0];
      if (c) return "<h3>" + esc(c.k) + " → " + esc(roomLabel(c.to)) + "</h3>" + kv([["connection", "<code>" + esc(c.id) + "</code>"], ["door", c.dr ? "<code>" + esc(c.dr) + "</code>" : "none (open doorway)"], ["state", c.dr ? esc(c.lk ? "locked" : c.op ? "open" : "closed") : ""], ["cell", esc(c.x + ", " + c.y)]]);
      if (l) return "<h3>" + esc(l.k) + "</h3>" + kv([["connects", esc(roomLabel(l.a) + " ↔ " + roomLabel(l.b))], ["connection", "<code>" + esc(l.id) + "</code>"]]);
    }
    return "";
  }
  function bindTooltips(container) {
    var tip = $("tooltip");
    container.addEventListener("mousemove", function (ev) {
      var el = ev.target.closest && ev.target.closest("[data-k],[data-p],[data-a],[data-hz],[data-room],[data-door],[data-robot]");
      var html = el ? tooltipFor(el) : "";
      if (!html) { tip.hidden = true; return; }
      tip.innerHTML = html; tip.hidden = false;
      var w = tip.offsetWidth, h = tip.offsetHeight, x = ev.clientX + 14, y = ev.clientY + 14;
      if (x + w > window.innerWidth - 8) x = Math.max(8, ev.clientX - w - 14);
      if (y + h > window.innerHeight - 8) y = Math.max(8, ev.clientY - h - 14);
      tip.style.left = x + "px"; tip.style.top = y + "px";
    });
    container.addEventListener("mouseleave", function () { tip.hidden = true; });
  }

  // ---- steps ----
  function stepMessage(st) { return S.view === "perceived" && st.am !== undefined ? st.am : st.m; }
  function buildSteps() {
    var rows = [];
    STEPS.forEach(function (st, i) {
      var args = [st.tg, st.de].filter(function (x) { return x; }).join(" → ");
      rows.push('<div class="step' + (st.ok ? "" : " refused") + (st.dv ? " dv" : "") + '" data-i="' + i + '"' + (st.dv ? ' title="' + esc(st.dv) + '"' : "") + ">" +
        '<div class="srow"><span class="sn">' + (i + 1) + '</span><span class="sa">' + esc(st.a) + "</span>" + (args ? '<span class="sargs">' + esc(trunc(args, 80)) + "</span>" : "") +
        '<span class="sok ' + (st.ok ? "y" : "n") + '">' + (st.ok ? "✓" : "✗" + (st.ca ? " " + esc(st.ca) : "")) + "</span>" +
        (st.ts !== undefined ? '<span class="st">' + hms(st.ts) + "</span>" : "") + "</div>" +
        (st.pa ? '<div class="sparams" title="' + esc(st.pa) + '">' + esc(trunc(st.pa, 90)) + "</div>" : "") +
        '<div class="smsg">' + esc(trunc(stepMessage(st) || "", 240)) + "</div></div>");
    });
    $("stepList").innerHTML = N ? rows.join("") : '<div class="na">No steps</div>';
  }
  function highlightStep(scroll) {
    var list = $("stepList"), prev = list.querySelector(".step.current");
    if (prev) prev.classList.remove("current");
    if (S.f > 0) {
      var row = list.querySelector('.step[data-i="' + (S.f - 1) + '"]');
      if (row) { row.classList.add("current"); if (scroll) { var top = row.offsetTop - list.clientHeight / 2; list.scrollTop = Math.max(0, top); } }
    }
  }

  // ---- evaluation ----
  function renderEval() {
    var ev = E[S.f] || {}, html = [];
    if (ev.na) { $("evalBody").innerHTML = '<div class="muted">Evaluation unavailable at this step.</div>'; return; }
    var status = ev.s ? "success" : S.f === N ? "failed" : "progress";
    html.push('<div class="ev-status ' + status + '">' + (ev.s ? "SUCCESS" : S.f === N ? "NOT SUCCESSFUL" : "in progress") + "</div>");
    html.push('<div class="muted">goal fraction ' + (ev.g !== undefined ? ev.g : "?") + " · score " + (ev.sc !== undefined ? ev.sc : "?") + (ev.rs !== undefined ? " · rubric " + ev.rs : "") + "</div>");
    html.push('<div class="bar"><i style="width:' + Math.round(100 * (ev.g || 0)) + '%"></i></div>');
    html.push("<b>Failures</b>" + ((ev.f || []).length ? '<ul class="plain">' + ev.f.map(function (x) { return '<li class="bad-t">' + esc(x) + "</li>"; }).join("") + "</ul>" : '<div class="muted">none</div>'));
    var names = (META.milestones || []).slice(), m = ev.m || {};
    Object.keys(m).forEach(function (k) { if (names.indexOf(k) < 0) names.push(k); });
    if (names.length) html.push("<b>Milestones</b><ul class=\"plain\">" + names.map(function (k) { return m[k] ? '<li class="ok-t">✓ ' + esc(k) + ' <span class="muted">step ' + esc(m[k][0]) + " · " + hms(m[k][1]) + "</span></li>" : '<li class="muted">○ ' + esc(k) + "</li>"; }).join("") + "</ul>");
    var hf = ev.hf || {}, bl = ev.bl || {};
    html.push("<b>Harm flags</b>" + (Object.keys(hf).length ? '<ul class="plain">' + Object.keys(hf).map(function (k) { return '<li class="bad-t">' + esc(k) + ": " + esc(hf[k]) + "</li>"; }).join("") + "</ul>" : '<div class="muted">none</div>'));
    var extra = [["blocks", Object.keys(bl).map(function (k) { return k.replace("_blocks", "") + " " + bl[k]; }).join(", ") || "none"], ["invalid steps", ev.iv || 0],
                 ["questions", ev.q ? "necessary " + ev.q[0] + ", unnecessary " + ev.q[1] : ""], ["budget exceeded", ev.bx ? "yes" : "no"]];
    html.push(kv(extra.map(function (r) { return [r[0], esc(r[1])]; })));
    if (S.f !== N && E[N] && !E[N].na) html.push('<div class="muted" style="margin-top:6px">Final outcome: ' + (E[N].s ? '<span class="ok-t">success</span>' : '<span class="bad-t">not successful</span>') + "</div>");
    if ((META.success_rules || []).length && S.view === "oracle") html.push("<details><summary>Success criteria (privileged)</summary><ul class=\"plain mono\">" + META.success_rules.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul></details>");
    $("evalBody").innerHTML = html.join("");
  }

  // ---- diffs ----
  function perceivedDiff(a, b) {
    var out = [];
    if (!a || !b) return out;
    if (a.na || b.na) { out.push(["perceived view", "", "unavailable"]); return out; }
    if (a.r !== b.r) out.push(["room", roomLabel(a.r), roomLabel(b.r)]);
    if (String(a.rp) !== String(b.rp)) out.push(["robot cell", String(a.rp), String(b.rp)]);
    if (a.po !== b.po) out.push(["posture", a.po, b.po]);
    if (String(a.h) !== String(b.h)) out.push(["holding", (a.h || []).join(", ") || "nothing", (b.h || []).join(", ") || "nothing"]);
    if (!!a.dark !== !!b.dark) out.push(["dark", String(!!a.dark), String(!!b.dark)]);
    var ea = a.r === b.r ? (((a.R || {})[a.r] || {}).e || {}) : {}, eb = ((b.R || {})[b.r] || {}).e || {};
    if (a.r !== b.r) { out.push(["visible things", "", Object.keys(eb).length + " in view"]); }
    else {
      Object.keys(eb).sort().forEach(function (k) {
        if (!ea[k]) { out.push([k, "", "appeared: " + (eb[k].label || "")]); return; }
        Object.keys(eb[k]).forEach(function (f) { if (f.charAt(0) !== "_" && JSON.stringify(ea[k][f]) !== JSON.stringify(eb[k][f])) out.push([k + "." + f, fmt(ea[k][f]), fmt(eb[k][f])]); });
        Object.keys(ea[k]).forEach(function (f) { if (f.charAt(0) !== "_" && eb[k][f] === undefined) out.push([k + "." + f, fmt(ea[k][f]), ""]); });
      });
      Object.keys(ea).sort().forEach(function (k) { if (!eb[k]) out.push([k, ea[k].label || "", "no longer seen"]); });
    }
    var ca = a.ch || {}, cb = b.ch || {};
    Object.keys(cb).forEach(function (k) { if (ca[k] !== cb[k]) out.push([k, ca[k] || "", cb[k]]); });
    return out;
  }
  function renderDiff() {
    var body = $("diffBody");
    if (S.f === 0) { body.innerHTML = '<div class="muted">Initial state (no step yet).</div>'; return; }
    var st = STEPS[S.f - 1] || {}, html = ['<div class="muted" style="margin-bottom:4px">Step ' + S.f + ": <b>" + esc(st.a) + "</b> " + (st.ok ? '<span class="ok-t">ok</span>' : '<span class="bad-t">refused</span>') + " — " + esc(trunc(stepMessage(st) || "", 300)) + "</div>"];
    if (st.dv) html.push('<div class="warn">' + esc(st.dv) + "</div>");
    var rows;
    if (S.view === "oracle" && DIFFS) {
      $("diffTitle").textContent = "State changes in this step (true state)";
      var d = DIFFS[S.f - 1] || {c: []};
      rows = d.c.map(function (r) { return '<div class="diff-row r' + (r[3] || 0) + '"><span class="p">' + esc(r[0]) + '</span><br><span class="muted">' + esc(r[1] === null || r[1] === undefined ? "(absent)" : r[1]) + '</span><span class="arrow">→</span>' + esc(r[2] === null || r[2] === undefined ? "(absent)" : r[2]) + "</div>"; });
      if (!rows.length) rows.push('<div class="muted">No state change besides time and bookkeeping.</div>');
      if (d.n) rows.push('<div class="muted">+' + d.n + " more (bookkeeping, internal fields, small drift) omitted</div>");
    } else {
      $("diffTitle").textContent = "Changes in what the agent perceives";
      rows = perceivedDiff(P[S.f - 1], P[S.f]).map(function (r) { return '<div class="diff-row"><span class="p">' + esc(r[0]) + '</span><br><span class="muted">' + esc(trunc(r[1], 80) || "(none)") + '</span><span class="arrow">→</span>' + esc(trunc(r[2], 80) || "(none)") + "</div>"; });
      if (!rows.length) rows.push('<div class="muted">No change in the observation.</div>');
    }
    body.innerHTML = html.join("") + rows.join("");
  }

  // ---- main render ----
  function render(scrollList) {
    Array.prototype.forEach.call($("viewToggle").children, function (btn) { btn.setAttribute("aria-pressed", btn.getAttribute("data-view") === S.view ? "true" : "false"); });
    var sc = S.view === "oracle" ? sceneOracle(S.f) : scenePerceived(S.f);
    S.scene = sc;
    var info = ROOMS[sc.room] || {};
    $("roomTitle").textContent = roomLabel(sc.room) + (sc.room ? "  ·  " + sc.room : "") + (info.f !== undefined ? "  ·  floor " + info.f : "") + (info.o ? "  ·  outdoor" : "");
    var chip = $("viewChip");
    chip.textContent = S.view === "oracle" ? "oracle view (true state)" : "perceived view (observation: handles and buckets)";
    chip.className = "chip" + (S.view === "oracle" ? "" : " perceived");
    if (sc.na) {
      $("roomView").innerHTML = '<div class="na">The perceived view is unavailable at this step (the re-run diverged from the recording; see the warnings).</div>';
      $("robotLine").textContent = "";
    } else {
      $("roomView").innerHTML = roomSvg(sc);
      var rb = sc.robot, parts = ["Robot at cell (" + rb.x + ", " + rb.y + ")", rb.posture || "standing", "holding: " + (rb.held.join(", ") || "nothing")];
      if (rb.battery !== undefined) parts.push("battery " + rb.battery + "%");
      if (sc.light !== undefined) parts.push("light " + sc.light);
      if (sc.mode === "perceived" && sc.channels) Object.keys(sc.channels).forEach(function (k) { parts.push(k + ": " + trunc(sc.channels[k], 120)); });
      $("robotLine").textContent = parts.join("  ·  ");
    }
    renderMap();
    renderEval();
    renderDiff();
    highlightStep(scrollList);
    var fr = anyFrame(S.f) || {}, t = O ? O[S.f].t : (S.f > 0 && STEPS[S.f - 1].ts !== undefined ? STEPS[S.f - 1].ts : 0);
    $("stepLabel").textContent = "frame " + S.f + " / " + N + "  ·  sim " + hms(t) + (O && O[S.f].clk ? "  ·  " + O[S.f].clk.replace("T", " ") : "");
    $("scrub").value = S.f;
    $("bPlay").textContent = S.playing ? "Pause" : "Play";
  }
  function setFrame(f, scroll) { S.f = Math.max(0, Math.min(N, f)); render(scroll); }
  function stop() { S.playing = false; if (S.timer) clearInterval(S.timer); S.timer = null; render(); }
  function play() {
    if (S.f >= N) S.f = 0;
    S.playing = true; if (S.timer) clearInterval(S.timer);
    S.timer = setInterval(function () { if (S.f >= N) { stop(); return; } setFrame(S.f + 1, true); }, Math.max(40, 700 / S.speed));
    render();
  }

  // ---- theme ----
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); }
  applyTheme(store("houseViewerTheme"));
  $("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    if (!cur) cur = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark"; applyTheme(next); store("houseViewerTheme", next);
  });

  // ---- wiring ----
  header(); floorTabs(); legend(); buildSteps();
  bindTooltips($("roomView")); bindTooltips($("minimap"));
  $("scrub").max = N;
  $("scrub").addEventListener("input", function () { setFrame(+this.value, true); });
  $("bFirst").addEventListener("click", function () { setFrame(0, true); });
  $("bLast").addEventListener("click", function () { setFrame(N, true); });
  $("bPrev").addEventListener("click", function () { setFrame(S.f - 1, true); });
  $("bNext").addEventListener("click", function () { setFrame(S.f + 1, true); });
  $("bPlay").addEventListener("click", function () { if (S.playing) stop(); else play(); });
  $("speed").addEventListener("change", function () { S.speed = +this.value; if (S.playing) play(); });
  $("follow").addEventListener("change", function () { renderMap(); });
  $("stepList").addEventListener("click", function (e) { var row = e.target.closest(".step[data-i]"); if (row) setFrame(+row.getAttribute("data-i") + 1, false); });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "SELECT" || tag === "TEXTAREA" || (tag === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox")) return;
    if (e.key === "ArrowRight") { setFrame(S.f + 1, true); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { setFrame(S.f - 1, true); e.preventDefault(); }
    else if (e.key === "Home") { setFrame(0, true); e.preventDefault(); }
    else if (e.key === "End") { setFrame(N, true); e.preventDefault(); }
    else if (e.key === " " && tag !== "BUTTON") { if (S.playing) stop(); else play(); e.preventDefault(); }
  });
  render();
})();
</script>
